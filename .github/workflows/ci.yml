# CI and the production deploy gate. See "Deploy triggers" in DEPLOYMENT.md.
#
# staging: Coolify auto-deploys on push, so the run there is a report card. It
#          also records the "smoke" and "checks" results on the commit, which
#          the main ruleset requires before scripts/promote-main.mjs may push it.
# main:    Coolify auto-deploy is OFF. deploy-prod below is the only trigger and
#          runs only after smoke and checks pass, so a broken commit never
#          reaches prod.
#
# Temporarily (21 October 2026) pushes to staging do not run CI, to save
# Actions minutes while we push often. Before promoting, run it by hand:
# `gh workflow run CI --ref staging` (or "Run workflow" in the Actions tab),
# so the commit carries the smoke and checks results the main ruleset needs.
# To restore, add staging back to push.branches below.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main, staging]

# Jobs only read the repository; deploy-prod authenticates to Coolify with its own secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    # Builds the image exactly as Coolify does (same Dockerfile, same compose
    # file), boots the stack on an empty database and checks it came up:
    # migrations applied, admin created, server answering with a live DB.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: classiflow-ci
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0123456789
      DEFAULT_ADMIN_EMAIL: admin@classiflow.local
      DEFAULT_ADMIN_PASSWORD: ci-password
      POSTGRES_PASSWORD: ci-only-db-password
      # Exercise the least-privilege runtime role the way production can run it.
      APP_DB_USER: classiflow_app
      APP_DB_PASSWORD: ci-only-app-db-password
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build and start the stack
        # --wait blocks until every healthcheck passes, including the app's
        # own /api/health probe, and fails if one goes unhealthy.
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Health endpoint reports a connected database
        run: |
          body=$(docker compose exec -T app wget -qO- http://localhost:3000/api/health)
          echo "$body"
          echo "$body" | grep -q '"database":"connected"'
      - name: Health endpoint reports the commit that was built
        run: |
          docker compose exec -T app wget -qO- http://localhost:3000/api/health \
            | grep -q "\"release\":\"$SOURCE_COMMIT\""
      - name: Server connects as the runtime role, not the schema owner
        run: |
          users=$(docker compose exec -T postgres psql -U classiflow -d classiflow -tAc \
            "SELECT DISTINCT usename FROM pg_stat_activity WHERE datname = 'classiflow' AND usename <> 'classiflow'")
          echo "app connections as: $users"
          [ "$users" = "$APP_DB_USER" ]
      - name: Default admin exists
        run: |
          count=$(docker compose exec -T postgres psql -U classiflow -d classiflow -tAc \
            "SELECT count(*) FROM \"User\" WHERE email = '$DEFAULT_ADMIN_EMAIL'")
          echo "admin rows: $count"
          [ "$count" = "1" ]
      - name: Login page renders
        run: docker compose exec -T app wget -qO /dev/null http://localhost:3000/login
      - name: Scan the image for fixable critical vulnerabilities
        # The image Coolify would build from this commit (same Dockerfile).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: classiflow-ci-app
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  checks:
    # Typecheck, lint and unit tests block the deploy: next.config.ts skips type
    # and lint errors during build, so this is the only place they are caught.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Same dependency graph as the Dockerfile: exactly package-lock.json.
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint

  integration:
    # Route handlers against a real PostgreSQL: access control, labelling rules,
    # imports. See tests/integration/README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: classiflow
          POSTGRES_PASSWORD: classiflow_password
          POSTGRES_DB: classiflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U classiflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://classiflow:classiflow_password@localhost:5432/classiflow_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Integration tests
        run: npm run test:integration

  e2e:
    # Browser journeys (sign-in, queue search/race/error, dialogs, keyboard
    # labelling, export) against a production build. See tests/e2e/README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: classiflow
          POSTGRES_PASSWORD: classiflow_password
          POSTGRES_DB: classiflow_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U classiflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://classiflow:classiflow_password@localhost:5432/classiflow_e2e_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Browser journeys
        run: npm run test:e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [smoke, checks, integration, e2e]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Trigger the Coolify production deployment
        env:
          # Repository secrets. The URL is Coolify's deploy API endpoint for the
          # production application (not its git webhook):
          #   https://<coolify-host>/api/v1/deploy?uuid=<app-uuid>&force=false
          COOLIFY_PROD_WEBHOOK: ${{ secrets.COOLIFY_PROD_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_PROD_WEBHOOK" ] || [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "::error::COOLIFY_PROD_WEBHOOK and COOLIFY_API_TOKEN must both be set as repository secrets, otherwise nothing deploys production."
            exit 1
          fi
          deploy() {
            curl --silent --show-error --output response.json --write-out '%{http_code}' \
              --request "$1" "$COOLIFY_PROD_WEBHOOK" \
              --header "Authorization: Bearer $COOLIFY_API_TOKEN"
          }
          # Current Coolify wants POST; older builds only answer GET.
          http_code=$(deploy POST)
          if [ "$http_code" = "405" ]; then
            echo "POST returned 405; retrying as GET for older Coolify builds."
            http_code=$(deploy GET)
          fi
          echo "Coolify responded HTTP $http_code:"
          cat response.json || true
          echo
          case "$http_code" in
            2*) echo "Deployment queued." ;;
            405) echo "::error::Coolify rejected both POST and GET (HTTP 405). The stored URL is probably the git webhook, not /api/v1/deploy."; exit 1 ;;
            401|403) echo "::error::Coolify rejected the token (HTTP $http_code). Check COOLIFY_API_TOKEN has deploy permission."; exit 1 ;;
            404) echo "::error::Coolify does not recognise that uuid (HTTP 404). Check COOLIFY_PROD_WEBHOOK points at the production application."; exit 1 ;;
            *) echo "::error::Coolify refused the deploy request (HTTP $http_code). Production was NOT updated."; exit 1 ;;
          esac
      - name: Wait for production to run this commit
        # A queued deploy is not a healthy one. With the repository variable
        # PROD_HEALTH_URL (https://<prod-host>/api/health) set, wait until
        # production reports this commit as its release and a connected database.
        env:
          PROD_HEALTH_URL: ${{ vars.PROD_HEALTH_URL }}
        run: |
          if [ -z "$PROD_HEALTH_URL" ]; then
            echo "::warning::PROD_HEALTH_URL is not set, so the deploy is not verified. Check the Coolify UI."
            exit 0
          fi
          for attempt in $(seq 1 60); do
            body=$(curl --silent --max-time 10 "$PROD_HEALTH_URL" || true)
            if echo "$body" | grep -q "\"release\":\"$GITHUB_SHA\"" && echo "$body" | grep -q '"database":"connected"'; then
              echo "Production runs $GITHUB_SHA: $body"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Production did not report release $GITHUB_SHA within 20 minutes. Last response: $body"
          exit 1
