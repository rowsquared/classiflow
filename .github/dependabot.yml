# Reviewable dependency updates. PRs target staging (the integration branch);
# CI runs on them like any other change. Security alerts come from the
# repository's Dependabot alerts, independent of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Packages that must move together arrive as one PR, majors included.
      framework:
        patterns: [next, react, react-dom, eslint-config-next, "@types/react", "@types/react-dom"]
      prisma:
        patterns: [prisma, "@prisma/client", "@prisma/adapter-pg"]
      # One PR for other routine bumps; other majors arrive one by one.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Prisma 8 only after general availability (docs/plans/modernization-2026-10.md).
      - dependency-name: prisma
        versions: [">=8.0.0-0"]
      - dependency-name: "@prisma/client"
        versions: [">=8.0.0-0"]
      - dependency-name: "@prisma/adapter-pg"
        versions: [">=8.0.0-0"]

  - package-ecosystem: docker
    directory: /
    target-branch: staging
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: monthly
