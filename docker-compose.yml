services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-classiflow}
      # Required: no fallback, so a deployment never runs on a published password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-classiflow}
    volumes:
      # PostgreSQL 18 images keep their data in /var/lib/postgresql/18/docker;
      # mounting the parent lets a later major version sit next to it.
      - postgres_data:/var/lib/postgresql
    # Port mapping removed for Coolify compatibility - PostgreSQL is only accessible internally
    # Uncomment the next 2 lines for local development if you need direct database access
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-classiflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Commit being built; /api/health reports it so a deploy can be checked.
        # Coolify sets it when "Include Source Commit in Build" is on.
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    restart: unless-stopped
    # Port mapping removed for Coolify compatibility - Coolify manages ports externally
    # Uncomment the next 2 lines for local development if you need direct access
    # ports:
    #   - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database. This is the schema owner: it runs migrations (and recovery
      # scripts via `docker compose exec`).
      DATABASE_URL: postgresql://${POSTGRES_USER:-classiflow}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-classiflow}?schema=public
      # Required: the server runs as this least-privilege role, which workspace
      # row security binds. scripts/start.sh creates/updates it on every start.
      APP_DB_USER: ${APP_DB_USER:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}

      # Authentication (Better Auth, lib/auth.ts)
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      SIGN_IN_RATE_LIMIT: ${SIGN_IN_RATE_LIMIT:-10}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      # Progress reports: days and weeks in this IANA zone unless a workspace sets its own.
      REPORTING_TIMEZONE: ${REPORTING_TIMEZONE:-UTC}

      # Default Admin User
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      # Required on first start (no admin yet); ignored once an admin exists.
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-Admin User}

      # Email (optional; off without the secret). ENV_SETUP.md "Email".
      N8N_EMAIL_WEBHOOK_SECRET: ${N8N_EMAIL_WEBHOOK_SECRET:-}
      N8N_EMAIL_WEBHOOK_URL: ${N8N_EMAIL_WEBHOOK_URL:-https://n8n.rowsquared.com/webhook/send-email}
      N8N_EMAIL_WEBHOOK_HEADER: ${N8N_EMAIL_WEBHOOK_HEADER:-send-email-api}
      N8N_EMAIL_WEBHOOK_TIMEOUT: ${N8N_EMAIL_WEBHOOK_TIMEOUT:-15}
      APP_BASE_URL: ${APP_BASE_URL:-}
      INVITATION_LINK_HOURS: ${INVITATION_LINK_HOURS:-72}
      PASSWORD_RESET_LINK_MINUTES: ${PASSWORD_RESET_LINK_MINUTES:-60}

      # AI Labeling (Optional)
      # Encrypts the workspaces' AI tokens; back it up apart from the database.
      AI_CREDENTIALS_KEYS: ${AI_CREDENTIALS_KEYS:-}
      # Registered as an approved AI service at start-up; configures no workspace.
      AI_LABELING_API_URL: ${AI_LABELING_API_URL:-}
      AI_MAX_ACTIVE_JOBS_PER_WORKSPACE: ${AI_MAX_ACTIVE_JOBS_PER_WORKSPACE:-3}
      AI_MAX_ACTIVE_JOBS: ${AI_MAX_ACTIVE_JOBS:-10}
      AI_LABELING_BATCH_SIZE: ${AI_LABELING_BATCH_SIZE:-100}
      AI_LEARNING_BATCH_SIZE: ${AI_LEARNING_BATCH_SIZE:-100}
      AI_LEARNING_MIN_NEW_ANNOTATIONS: ${AI_LEARNING_MIN_NEW_ANNOTATIONS:-500}
      AI_JOB_POLL_INTERVAL_MS: ${AI_JOB_POLL_INTERVAL_MS:-5000}
      AI_JOB_POLL_TIMEOUT_MS: ${AI_JOB_POLL_TIMEOUT_MS:-600000}
      AI_SOURCE_SLUG: ${AI_SOURCE_SLUG:-}

      # Logs and traces (ENV_SETUP.md "Logs and traces"); tracing is off
      # unless an OTLP endpoint is set.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-classiflow}
    # Migrations, optional runtime DB role, admin bootstrap, then the server.
    command: sh scripts/start.sh
    # The server runs as an unprivileged user on port 3000: no Linux
    # capabilities or privilege escalation needed.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem. The start script and the server write only
    # Next's cache (created at start, used by image optimisation) and
    # temporary files; both live in memory. Checked with scripts/start.sh's
    # steps and the standalone server on a read-only mount (DEPLOYMENT.md).
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    # Resource limits: size them from production usage, then uncomment.
    # mem_limit: 1g
    # cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
